<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Matemática Kusi - CNEB Inicial (3, 4 y 5 Años) | Gestión Institucional</title>
  <meta name="description" content="Plataforma de Educación Inicial basada en el Currículo Nacional de la Educación Básica (CNEB) del Perú. Módulos para 3, 4 y 5 años con áreas curriculares, competencias, capacidades oficiales y evaluación formativa.">
  <meta name="theme-color" content="#38BDF8">

  <!-- Fuentes Infantiles Amigables de Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&family=Fredoka:wght@400;600;700;800&family=Nunito:wght@700;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            fun: ['"Bubblegum Sans"', '"Fredoka"', 'cursive'],
            main: ['"Fredoka"', '"Nunito"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Estilos Personalizados del Sistema Infantil UX/UI -->
  <link rel="stylesheet" href="css/styles.css?v=4.6">
</head>
<body class="relative min-h-screen overflow-x-hidden">

  <!-- CONTENEDOR GLOBAL CON NAVEGACIÓN LATERAL (SIDEBAR / SLIDERBAR) -->
  <div class="app-container">
    
    <!-- Backdrop oscuro para móviles y tablets -->
    <div id="sidebar-backdrop" class="app-sidebar-backdrop"></div>

    <!-- Contenedor del Sidebar / Barra Lateral -->
    <div id="sidebar-container">
      <!-- Inyectado dinámicamente por SidebarModule -->
    </div>

    <!-- VIEWPORT PRINCIPAL DE LA APLICACIÓN -->
    <div class="app-main-viewport">
      
      <!-- BARRA SUPERIOR (HEADER) INSTITUCIONAL -->
      <header class="w-full bg-white/85 backdrop-blur-md border-b-4 border-amber-300 py-2.5 px-4 shadow-sm sticky top-0 z-40">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
          
          <!-- Botón Toggle de Barra Lateral (Móvil) + Título -->
          <div class="flex items-center gap-3">
            <button id="btn-toggle-sidebar-mobile" class="p-2 rounded-2xl bg-amber-100 hover:bg-amber-200 text-amber-950 font-bold border-2 border-amber-300 shadow-sm flex items-center justify-center lg:hidden" title="Abrir Menú">
              <span class="text-xl">☰</span>
            </button>
            
            <div class="flex items-center gap-2 cursor-pointer" onclick="window.SidebarModule.navigateTo('dashboard')">
              <span class="text-3xl animate-bounce-soft" id="app-logo-mascot">🦙</span>
              <div>
                <span class="text-lg md:text-xl font-black text-amber-950 font-fun leading-none block" id="app-logo-title">Matemática Kusi</span>
                <span class="text-[10px] font-bold text-amber-700 bg-amber-100 px-2 py-0.2 rounded-full inline-block truncate max-w-[190px]" id="app-logo-school">CNEB Inicial (3, 4 y 5 Años)</span>
              </div>
            </div>
          </div>

          <!-- Indicadores y Controles de Perfil -->
          <div class="flex items-center gap-2 md:gap-3">
            <div id="header-auth-badge"></div>

            <!-- Contador de Estrellas Ganadas -->
            <div class="flex items-center gap-1.5 bg-amber-400 border-2 border-white px-3 py-1 rounded-full shadow-sm">
              <span class="text-lg">⭐</span>
              <span id="star-count" class="font-fun font-black text-amber-950 text-lg leading-none">0</span>
            </div>

            <button id="btn-sound-toggle" class="btn-chunky bg-white text-slate-700 border-slate-200 btn-circle hidden" style="width: 44px; height: 44px; min-width: 44px; min-height: 44px;" title="Sonido">
              <span id="sound-icon" class="text-lg">🔊</span>
            </button>
          </div>

        </div>
      </header>

      <!-- ÁREA PRINCIPAL DE CONTENIDO DINÁMICO -->
      <main id="app-main-content" class="flex-1 w-full relative z-10 flex flex-col justify-center">
        <!-- Vistas inyectadas por SidebarModule y AdminViews -->
      </main>

      <!-- ZONA DE LA MASCOTA KUSI Y RETROALIMENTACIÓN VOCAL -->
      <footer class="w-full relative z-30 pb-4 px-4 pointer-events-none">
        <div class="max-w-4xl mx-auto flex justify-center">
          <div id="mascot-host" class="pointer-events-auto">
            <!-- Renderizado de Kusi y su burbuja parlante -->
          </div>
        </div>
      </footer>

    </div>
  </div>

  <!-- =========================================================================
       SCRIPTS DE LA APLICACIÓN (MÓDULOS JAVASCRIPT AUTOCONTENIDOS)
       ========================================================================= -->
  <script src="js/audio.js?v=4.6"></script>
  <script src="js/confetti.js?v=4.6"></script>
  <script src="js/data.js?v=4.6"></script>
  <script src="js/niveles.js?v=4.6"></script>
  <script src="js/cneb-curriculum.js?v=4.6"></script>
  <script src="js/state.js?v=4.6"></script>
  <script src="js/school-management.js?v=4.6"></script>
  <script src="js/mascot.js?v=4.6"></script>
  <script src="js/dragdrop.js?v=4.6"></script>
  
  <!-- Minijuegos Mundo 1: Cantidad -->
  <script src="js/games/cantidad-agrupacion.js?v=4.6"></script>
  <script src="js/games/cantidad-seriacion.js?v=4.6"></script>
  <script src="js/games/cantidad-conteo.js?v=4.6"></script>
  <script src="js/games/cantidad-operaciones.js?v=4.6"></script>
  <script src="js/games/cantidad-peso-tiempo.js?v=4.6"></script>

  <!-- Minijuegos Mundo 2: Espacio -->
  <script src="js/games/espacio-formas.js?v=4.6"></script>
  <script src="js/games/espacio-ubicacion.js?v=4.6"></script>
  <script src="js/games/espacio-desplazamiento.js?v=4.6"></script>
  <script src="js/games/espacio-longitud.js?v=4.6"></script>

  <!-- Supabase CDN Oficial v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js?v=4.6"></script>

  <!-- Módulos de Gestión de Estudiantes, Autenticación, Sidebar, Admin y Docente -->
  <script src="js/students.js?v=4.6"></script>
  <script src="js/auth.js?v=4.6"></script>
  <script src="js/sidebar.js?v=4.6"></script>
  <script src="js/admin-views.js?v=4.6"></script>
  <script src="js/familia.js?v=4.6"></script>
  <script src="js/docente.js?v=4.6"></script>
  <script src="js/app.js?v=4.6"></script>

</body>
</html>
